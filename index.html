<!DOCTYPE html>
<html lang="la">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Officium de Deo Patre</title>
    <style>
        :root {
            --bg-color: #faf8f5;
            --card-bg: #ffffff;
            --text-color: #2b2b2b;
            --rubric-color: #a81c1c;
            --nav-bg: #eee9e0;
            --nav-text: #555555;
            --active-tab-bg: #a81c1c;
            --active-tab-text: #ffffff;
            --border-color: #e0d8cc;
        }
        body.dark-theme {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --rubric-color: #ff6b6b;
            --nav-bg: #2a2a2a;
            --nav-text: #aaa;
            --active-tab-bg: #b82828;
            --active-tab-text: #ffffff;
            --border-color: #333333;
        }
        body.sepia-theme {
            --bg-color: #f4ebd9;
            --card-bg: #fdf6e3;
            --text-color: #433422;
            --rubric-color: #8b0000;
            --nav-bg: #e6d7c3;
            --nav-text: #665235;
            --active-tab-bg: #8b0000;
            --active-tab-text: #ffffff;
            --border-color: #d8c4a8;
        }
        * { box-sizing: border-box; transition: background-color 0.25s, color 0.25s; }
        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0; padding: 0; line-height: 1.7;
        }
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 20px; background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100;
        }
        header h1 { font-size: 1.1rem; margin: 0; letter-spacing: 1.5px; color: var(--rubric-color); text-transform: uppercase; }
        .theme-switcher { display: flex; gap: 8px; }
        .theme-btn {
            background: none; border: 1px solid var(--border-color); border-radius: 50%;
            width: 28px; height: 28px; cursor: pointer; font-size: 0.8rem;
            display: flex; align-items: center; justify-content: center; color: var(--text-color);
        }
        
        /* Styl sekcji z obrazem */
        .app-hero {
            text-align: center;
            padding: 20px 15px 10px 15px;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 10px;
        }
        .app-hero img {
            max-width: 220px;
            height: auto;
            border-radius: 4px;
            border: 2px solid var(--border-color);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        nav.tabs {
            display: flex; overflow-x: auto; background-color: var(--nav-bg);
            border-bottom: 1px solid var(--border-color); padding: 8px; gap: 6px;
        }
        nav.tabs::-webkit-scrollbar { display: none; }
        .tab-btn {
            background: transparent; border: none; color: var(--nav-text);
            padding: 8px 14px; font-family: inherit; font-size: 0.85rem;
            border-radius: 20px; white-space: nowrap; cursor: pointer; font-weight: 500;
        }
        .tab-btn.active { background-color: var(--active-tab-bg); color: var(--active-tab-text); font-weight: bold; }
        main { max-width: 680px; margin: 0 auto; padding: 20px 15px 60px 15px; }
        .office-section {
            display: none; background: var(--card-bg); padding: 25px 20px;
            border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); border: 1px solid var(--border-color);
        }
        .office-section.active { display: block; }
        h2 { font-size: 1.3rem; text-align: center; color: var(--rubric-color); margin-top: 0; margin-bottom: 25px; border-bottom: 1px double var(--border-color); padding-bottom: 10px; }
        p { margin-bottom: 14px; text-align: justify; }
        .versiculum { margin-left: 10px; text-indent: -10px; }
        .rubric { color: var(--rubric-color); font-size: 0.85rem; font-style: italic; font-weight: bold; margin-top: 20px; margin-bottom: 5px; display: block; }
        .cross { color: var(--rubric-color); font-weight: bold; }
        hr.divider { border: 0; height: 1px; background: var(--border-color); margin: 25px 0; }
    </style>
</head>

    <header>

        <div class="theme-switcher">

            <button class="theme-btn" onclick="setTheme('dark')" title="Ciemny">🌙</button>
        </div>
    </header>
